# Candidate companies to probe for ATS tenants at G1-W1.
#
# NOT a tenant list. Every slug here is an unverified guess; the cxs oracle decides:
#   200 -> tenant + site valid | 404 S21 -> tenant exists, site slug wrong | 422 -> no tenant
# Candidates that come back 422 are negative-cached in tenant_probes and cost one probe each.
# Weighted toward banks/fintech and large tech with Dublin/London presence (see criteria.yaml).

