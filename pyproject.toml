[project]
name = "jobagent"
version = "0.0.0"
description = "Autonomous multi-channel job application agent"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "httpx>=0.27",
  "curl-cffi>=0.7",
  "patchright>=1.49",
  "playwright>=1.49",
  "pypdf>=4.2",
  "pdfplumber>=0.11",
  "rank-bm25>=0.2.2",
  "numpy>=1.26",
  "openai>=1.40",
]

[project.scripts]
jobagent = "jobagent.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
